<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="原價屋報價的電腦零件相容性配單工具：選零件時即時排除腳位、記憶體世代、尺寸與電源不相容的組合。非官方開源專案。" />
    <title>原價煮便當 · 原價屋相容性配單</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B1%3C/text%3E%3C/svg%3E" />
    <script>
      // 防閃爍：CSS 載入前套用主題；無痕模式下 localStorage 可能丟出例外
      (function () {
        var theme = 'light';
        try { theme = localStorage.getItem('theme') || 'light'; } catch (e) {}
        document.documentElement.classList.toggle('dark', theme === 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
