name: PoC - CoolPC reachability & spec extraction

# PoC／管線驗證：推送程式變更時自動執行一次，也可手動觸發（文件變更不觸發，避免多餘請求）。
# 每日觀察已改由 daily-prices.yml 負責，本 workflow 不再排程，以免每天對原價屋多發一次請求。
# 每次只對原價屋發出 robots.txt 與 evaluate.php 各一次請求；後續步驟都讀同一份存檔。
on:
  push:
    paths:
      - 'poc/**.py'
      - 'pipeline/**.py'
      - 'scripts/**.py'
      - 'tests/**.py'
      - 'schema/**.py'
      - 'schema/**.json'
      - 'requirements.txt'
      - '.github/workflows/poc-coolpc-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poc-coolpc-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (extraction rules, pipeline)
        run: python -m unittest discover -v -s tests -t .

      - name: Unit tests (catalog / prices schema)
        working-directory: schema
        run: python -m unittest -v test_schema

      - name: Runner egress info
        run: |
          echo "Runner public IP / geo (ipinfo.io):"
          curl -sS -m 10 https://ipinfo.io/json | grep -E '"(ip|city|region|country|org)"' || true

      - name: Probe CoolPC
        run: |
          set +e
          python poc/coolpc_probe.py --out poc/out --save-html --audit 30 --dump-items
          code=$?
          cat poc/out/report.md >> "$GITHUB_STEP_SUMMARY"
          exit $code

      # 暫時：找出散熱器【WXZ】扣具代碼的圖例
      - name: Look for the cooler mount-code legend
        run: |
          python - <<'PY'
          import re, sys
          sys.path.insert(0, '.')
          from pipeline.coolpc import decode_html
          html, _ = decode_html(open('poc/out/evaluate.html', 'rb').read(), None)
          text = re.sub(r'<[^>]+>', ' ', html)
          seen = 0
          for pat in (r'扣具', r'【W】', r'W\s*[:：=]', r'WXYZ', r'腳位'):
              for m in re.finditer(pat, html):
                  ctx = re.sub(r'\s+', ' ', html[max(0, m.start() - 200): m.end() + 300])
                  print(f'--- {pat} @ {m.start()}: {ctx}')
                  seen += 1
                  if seen > 40:
                      break
          for m in re.finditer(r'<script[^>]*src="([^"]+)"', html):
              print('script', m.group(1))
          for m in re.finditer(r'<img[^>]*src="([^"]+)"', html):
              print('img', m.group(1))
          PY

      - name: Build draft catalog and validate against schema
        run: |
          set -o pipefail
          python poc/to_catalog.py poc/out/items.jsonl --out poc/out/draft | tee poc/out/draft-report.md
          cat poc/out/draft-report.md >> "$GITHUB_STEP_SUMMARY"

      # 以同一份存檔跑一次正式管線：產生草稿規格庫 → 產生報價快照 → 驗證
      - name: Pipeline end-to-end on the fetched page
        run: |
          set -o pipefail
          python scripts/bootstrap_catalog.py --html poc/out/evaluate.html --catalog-dir poc/out/pipeline/catalog \
            | tee -a "$GITHUB_STEP_SUMMARY"
          python scripts/update_prices.py --html poc/out/evaluate.html --catalog-dir poc/out/pipeline/catalog \
            --out poc/out/pipeline/prices/coolpc.json
          python schema/validate.py --catalog poc/out/pipeline/catalog/*.json --prices poc/out/pipeline/prices/coolpc.json
          ls -l poc/out/pipeline/prices/ poc/out/pipeline/catalog/ | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload raw HTML and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coolpc-probe-${{ github.run_id }}
          path: poc/out/
          retention-days: 14  # 涵蓋一至兩週的每日觀察
          if-no-files-found: ignore
